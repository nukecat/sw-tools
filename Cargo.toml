[package]
name = "sw-tools"
version = "0.7.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
sw-formats = { git = "https://github.com/nukecat/sw-formats", version = "0.1.0" }
midly = { version = "0.5.3" }
gltf = { version = "1.4.1", features = ["extras"] }
serde_json = "1"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "png", "jpeg"] }
comfy-table = { version = "8.0.1", optional = true }

[features]
default = ["cli"]
# Terminal-only pieces: the `sw-tools` binary and the `catalog` table printing.
# Disable with `default-features = false` to build the library for wasm32.
cli = ["dep:comfy-table"]

[[bin]]
name = "sw-tools"
path = "src/main.rs"
required-features = ["cli"]
